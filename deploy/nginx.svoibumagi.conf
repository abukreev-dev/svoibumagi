# Свои бумаги on ddl. Install only the port 80 block before issuing TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name svoibumagi.bukreev.pro;

    location /.well-known/acme-challenge/ {
        root /home/www/svoibumagi.bukreev.pro/acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name svoibumagi.bukreev.pro;

    ssl_certificate /etc/letsencrypt/live/svoibumagi.bukreev.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/svoibumagi.bukreev.pro/privkey.pem;
    client_max_body_size 21m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18110;
        include /etc/nginx/snippets/svoibumagi-proxy.conf;
    }
}
