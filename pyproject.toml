[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "svoibumagi"
version = "0.1.0"
description = "Self-hosted investment accounting from broker reports"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["fastapi>=0.115,<1", "starlette>=0.46,<2", "jinja2>=3.1,<4", "python-multipart>=0.0.9,<1", "xlrd>=2.0.2,<3", "openpyxl>=3.1,<4", "beautifulsoup4>=4.12,<5", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svoibumagi = ["templates/*.html", "static/*.css"]
