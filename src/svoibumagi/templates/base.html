<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Свои бумаги{% endblock %}</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #152633; background: #f3f7f7 }
    body { margin: 0 auto; max-width: 1240px; padding: 24px }
    header { display: flex; align-items: center; gap: 32px; border-bottom: 1px solid #d7e3e1; margin-bottom: 32px; flex-wrap: wrap }
    header h1 { font-size: 1.2rem; color: #086657; letter-spacing: -.03em }
    nav { display: flex; gap: 20px; flex: 1; flex-wrap: wrap }
    nav a { text-decoration: none; font-weight: 600; padding: 12px 0 }
    nav a:hover { text-decoration: underline }
    a { color: #087564 }
    section { background: white; border: 1px solid #dce7e4; border-radius: 16px; padding: 24px; margin: 18px 0; box-shadow: 0 5px 24px #142d2610 }
    .page-heading { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:20px }
    .page-heading h2 { font-size:2.1rem; margin:.1em 0; letter-spacing:-.045em }
    .page-heading p { margin:.2em 0; color:#586a72 }
    .eyebrow { text-transform:uppercase; font-size:.76rem; font-weight:700; letter-spacing:.12em; color:#087564!important }
    .text-link { white-space:nowrap; font-weight:700 }
    .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px }
    .summary-card { background:#fff; border:1px solid #dce7e4; border-radius:16px; padding:19px; display:flex; flex-direction:column; min-height:118px }
    .summary-card span { color:#586a72; font-size:.88rem }
    .summary-card strong { font-size:1.55rem; letter-spacing:-.04em; margin:10px 0 2px; overflow-wrap:anywhere }
    .summary-card small { margin-top:auto }
    .notice { background:#fff7e7; color:#6a4a10; border:1px solid #efdfb9; border-radius:12px; padding:13px 16px }
    .analytics-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 }
    .analytics-tabs a { background:#fff; border:1px solid #dce7e4; border-radius:999px; padding:8px 13px; text-decoration:none; font-size:.9rem }
    .analytics-tabs a[aria-current="page"] { background:#087564; color:#fff; border-color:#087564 }
    .date-picker { display:flex; align-items:center; flex-wrap:wrap; gap:8px }
    .metric-large { font-size:2.2rem; line-height:1.1; font-weight:750; letter-spacing:-.04em; margin:12px 0 }
    .portfolio-map { display:flex; flex-wrap:wrap; gap:8px }
    .map-tile { min-width:150px; min-height:100px; flex-basis:150px; background:#e4f2ed; border:1px solid #cce5da; border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:5px }
    .map-tile span { font-size:1.25rem; font-weight:700; color:#086657 }
    table { border-collapse: collapse; width: 100%; font-size: .92rem }
    th, td { border-bottom: 1px solid #e1e6eb; padding: 7px; text-align: left; vertical-align: top }
    th { background: #f5f9f8 }
    input, select, button { font: inherit; padding: 7px; margin: 3px }
    button { background: #087564; color: white; border: 0; border-radius: 8px; cursor: pointer }
    .error { color: #a52424; font-weight: 600 }
    .warn { color: #8a5600; font-weight: 600 }
    .ok { color: #176b42 }
    .scroll { overflow-x: auto }
    small { color: #536170 }
    @media(max-width:800px) { .summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)) } .page-heading { display:block } }
    @media(max-width:500px) { body { padding:12px } .summary-grid { grid-template-columns:1fr } section { padding:16px } }
  </style>
</head>
<body>
<header>
  <h1>Свои бумаги</h1>
  {% if logged_in %}
  <nav><a href="/">Портфель</a><a href="/analytics">Аналитика</a><a href="/instruments">Бумаги</a><a href="/operations">Операции</a></nav>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Выйти</button></form>
  {% endif %}
</header>
{% block content %}{% endblock %}
</body>
</html>
