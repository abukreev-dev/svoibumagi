<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Свои бумаги{% endblock %}</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #152633; background: #f3f7f7 }
    body { margin: 0 auto; max-width: 1240px; padding: 24px }
    header { display: flex; align-items: center; gap: 32px; border-bottom: 1px solid #d7e3e1; margin-bottom: 32px; flex-wrap: wrap }
    header h1 { font-size: 1.2rem; color: #086657; letter-spacing: -.03em }
    nav { display: flex; gap: 20px; flex: 1; flex-wrap: wrap }
    nav a { text-decoration: none; font-weight: 600; padding: 12px 0 }
    nav a:hover { text-decoration: underline }
    a { color: #087564 }
    section { background: white; border: 1px solid #dce7e4; border-radius: 16px; padding: 24px; margin: 18px 0; box-shadow: 0 5px 24px #142d2610 }
    .page-heading { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:20px }
    .page-heading h2 { font-size:2.1rem; margin:.1em 0; letter-spacing:-.045em }
    .page-heading p { margin:.2em 0; color:#586a72 }
    .eyebrow { text-transform:uppercase; font-size:.76rem; font-weight:700; letter-spacing:.12em; color:#087564!important }
    .text-link { white-space:nowrap; font-weight:700 }
    .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px }
    .summary-card { background:#fff; border:1px solid #dce7e4; border-radius:16px; padding:19px; display:flex; flex-direction:column; min-height:118px }
    .summary-card span { color:#586a72; font-size:.88rem }
    .summary-card strong { font-size:1.55rem; letter-spacing:-.04em; margin:10px 0 2px; overflow-wrap:anywhere }
    .summary-card small { margin-top:auto }
    .notice { background:#fff7e7; color:#6a4a10; border:1px solid #efdfb9; border-radius:12px; padding:13px 16px }
    .analytics-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 }
    .analytics-tabs a { background:#fff; border:1px solid #dce7e4; border-radius:999px; padding:8px 13px; text-decoration:none; font-size:.9rem }
    .analytics-tabs a[aria-current="page"] { background:#087564; color:#fff; border-color:#087564 }
    .date-picker { display:flex; align-items:center; flex-wrap:wrap; gap:8px }
    .metric-large { font-size:2.2rem; line-height:1.1; font-weight:750; letter-spacing:-.04em; margin:12px 0 }
    .portfolio-map { display:flex; flex-wrap:wrap; gap:8px }
    .map-tile { min-width:150px; min-height:100px; flex-basis:150px; background:#e4f2ed; border:1px solid #cce5da; border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:5px }
    .map-tile span { font-size:1.25rem; font-weight:700; color:#086657 }
    .home-sections { display:flex; flex-direction:column }
    .home-sections > section:nth-of-type(4) { order:1 }
    .home-sections > section:nth-of-type(5) { order:2 }
    .home-sections > section:nth-of-type(3) { order:3 }
    .home-sections > section:nth-of-type(1) { order:4 }
    .home-sections > section:nth-of-type(2) { order:5 }
    .home-sections > section:nth-of-type(6) { order:6 }
    .home-sections > section:nth-of-type(7) { order:7 }
    summary { cursor:pointer; font-weight:650; color:#087564; padding:4px 0 }
    details[open] > summary { margin-bottom:18px }
    table { border-collapse: collapse; width: 100%; font-size: .92rem }
    th, td { border-bottom: 1px solid #e1e6eb; padding: 7px; text-align: left; vertical-align: top }
    th { background: #f5f9f8 }
    input, select, button { font: inherit; padding: 7px; margin: 3px }
    button { background: #087564; color: white; border: 0; border-radius: 8px; cursor: pointer }
    .error { color: #a52424; font-weight: 600 }
    .warn { color: #8a5600; font-weight: 600 }
    .ok { color: #176b42 }
    .scroll { overflow-x: auto }
    small { color: #536170 }
    @media(max-width:800px) { .summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)) } .page-heading { display:block } }
    @media(max-width:500px) { body { padding:12px } .summary-grid { grid-template-columns:1fr } section { padding:16px } }

    /* The private workspace shares the landing page's palette and typography. */
    :root { color-scheme:light; --forest:#123d32; --pine:#24654d; --ink:#1b3029; --muted:#65766d; --line:#dfe6dd; --paper:#f6f7f2; --surface:#fffefa; font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper) }
    * { box-sizing:border-box }
    html { scroll-behavior:smooth }
    body { margin:0; padding:0; max-width:none; color:var(--ink); background:var(--paper) }
    a { color:var(--pine); text-underline-offset:3px }
    a:hover { color:var(--forest) }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline:3px solid #d28b50; outline-offset:3px }
    .app-header { margin:0; border-bottom:1px solid var(--line); background:var(--surface) }
    .header-inner { width:min(1440px,calc(100% - 64px)); min-height:76px; margin:auto; display:flex; align-items:center; gap:36px }
    .brand { display:inline-flex; align-items:center; gap:11px; color:var(--forest); text-decoration:none; font-size:1.16rem; font-weight:820; letter-spacing:-.04em; white-space:nowrap }
    .brand-mark { width:36px; height:36px; display:grid; place-items:center; color:#e2f4d9; background:var(--forest); border-radius:11px; font-size:1.15rem; transform:rotate(-7deg) }
    .brand-mark span { transform:rotate(7deg) }
    .main-nav { display:flex; align-items:stretch; align-self:stretch; flex-wrap:nowrap; gap:7px; flex:1 }
    .main-nav a { display:inline-flex; align-items:center; padding:0 17px; color:var(--muted); border-bottom:3px solid transparent; font-size:.91rem; font-weight:680; text-decoration:none }
    .main-nav a:hover, .main-nav a[aria-current="page"] { color:var(--forest); border-color:#7bb58b; text-decoration:none }
    .logout-form { margin-left:auto }
    .logout-form button { color:var(--forest); background:transparent; border:1px solid var(--line); padding:8px 15px }
    .logout-form button:hover { color:var(--forest); background:#eef5ec; border-color:var(--pine) }
    main { width:min(1440px,calc(100% - 64px)); margin:0 auto; padding:40px 0 88px }
    h1,h2,h3,p { margin-top:0 }
    h2,h3 { letter-spacing:-.035em }
    section { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px 30px; margin:18px 0; box-shadow:0 8px 28px rgba(27,48,41,.035) }
    section > h2, section > h3 { font-size:1.16rem; margin:0 0 18px }
    .page-heading { align-items:end; margin-bottom:26px }
    .page-heading h2 { font-size:clamp(2.3rem,4vw,3.3rem); line-height:1.08; margin:5px 0 10px; letter-spacing:-.06em }
    .page-heading p:not(.eyebrow) { color:var(--muted); max-width:790px; margin:0 }
    .eyebrow { color:var(--pine)!important; font-size:.72rem; font-weight:820; letter-spacing:.14em }
    .text-link { flex:none; text-decoration:none }
    .summary-grid { grid-template-columns:1.55fr repeat(3,1fr); gap:14px; margin-bottom:14px }
    .summary-card { position:relative; min-width:0; min-height:168px; padding:22px 24px; background:var(--surface); border-color:var(--line); border-radius:18px; box-shadow:0 8px 28px rgba(27,48,41,.035) }
    .summary-card span { color:var(--muted); font-weight:650 }
    .summary-card strong { margin:8px 0 0; font-size:clamp(1.6rem,2.25vw,2.15rem); line-height:1.13; font-variant-numeric:tabular-nums }
    .summary-card small { color:var(--muted); line-height:1.4 }
    .summary-card:first-child { overflow:hidden; color:white; background:linear-gradient(130deg,#123d32,#205d47); border-color:var(--forest); box-shadow:0 16px 34px rgba(18,61,50,.15) }
    .summary-card:first-child:after { content:""; position:absolute; width:210px; height:210px; right:-70px; top:-95px; border:1px solid rgba(255,255,255,.12); border-radius:50%; box-shadow:0 0 0 42px rgba(255,255,255,.035),0 0 0 84px rgba(255,255,255,.025); pointer-events:none }
    .summary-card:first-child span, .summary-card:first-child small { color:#cae3d5 }
    .summary-card:first-child strong { font-size:clamp(1.9rem,2.8vw,2.8rem) }
    .notice { background:#fff5de; color:#714e20; border-color:#ebd8ad; font-size:.9rem; line-height:1.55 }
    .analytics-tabs { flex-wrap:nowrap; overflow-x:auto; padding:2px 0 10px; margin:22px 0 12px; scrollbar-width:thin }
    .analytics-tabs a { flex:none; min-height:39px; padding:8px 15px; background:var(--surface); border-color:var(--line); border-radius:10px; color:var(--muted); font-weight:660 }
    .analytics-tabs a[aria-current="page"] { background:var(--forest); border-color:var(--forest) }
    .metric-large { font-size:clamp(2.4rem,5vw,4rem); font-variant-numeric:tabular-nums; color:var(--forest) }
    .map-tile { min-height:125px; padding:18px; background:#e5f1e6; border-color:#cfe1d2; border-radius:15px }
    .map-tile span { color:var(--forest); font-size:1.45rem }
    .login-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,430px); overflow:hidden; min-height:500px; margin:28px auto; max-width:1080px; border:1px solid var(--line); border-radius:22px; background:var(--surface); box-shadow:0 20px 70px rgba(18,61,50,.09) }
    .login-intro { position:relative; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; padding:54px; color:white; background:linear-gradient(145deg,#123d32,#24654d) }
    .login-intro:after { content:""; position:absolute; width:430px; height:430px; right:-130px; bottom:-220px; border:1px solid rgba(255,255,255,.14); border-radius:50%; box-shadow:0 0 0 64px rgba(255,255,255,.04),0 0 0 128px rgba(255,255,255,.025); pointer-events:none }
    .login-intro .eyebrow { color:#bce3c5!important }
    .login-intro h1 { max-width:470px; margin:22px 0; font-size:clamp(2.8rem,4vw,4.4rem); line-height:1.07; letter-spacing:-.06em }
    .login-intro p { max-width:420px; color:#d3e9da; line-height:1.7 }
    .login-intro small { position:relative; color:#bce3c5 }
    .login-panel { display:flex; flex-direction:column; justify-content:center; padding:54px 45px }
    .login-panel h2 { margin-bottom:9px; font-size:1.85rem }
    .login-panel p { color:var(--muted); font-size:.9rem }
    .login-panel p.error { color:#a52424 }
    .login-panel label { display:block; margin:25px 0 8px; font-weight:700 }
    .login-panel input[type=password] { width:100%; margin:0 0 14px }
    .login-panel button { width:100%; margin:0 }
    .home-sections { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 18px; align-items:start }
    .home-sections > section { min-width:0; margin:9px 0; order:initial!important }
    .home-sections > section.wide { grid-column:1 / -1 }
    .home-sections > section h2 { display:flex; align-items:center; gap:10px }
    .home-sections > section h2:before { content:""; width:7px; height:20px; border-radius:6px; background:#8cbb91; flex:none }
    table { font-size:.875rem; font-variant-numeric:tabular-nums }
    th,td { padding:12px 14px; border-bottom:1px solid #e9eee8 }
    th { color:#617369; background:#f2f6f0; font-size:.74rem; font-weight:790; letter-spacing:.035em; text-transform:uppercase; white-space:nowrap }
    tr:last-child td { border-bottom:0 }
    tbody tr:hover { background:#f7faf5 }
    .scroll { border:1px solid var(--line); border-radius:12px }
    .scroll table { min-width:640px }
    .scroll th:first-child,.scroll td:first-child { padding-left:18px }
    input,select,button { font:inherit }
    input:not([type=hidden]),select { max-width:100%; min-height:41px; padding:9px 12px; margin:4px 5px 4px 0; color:var(--ink); background:white; border:1px solid #cddbd0; border-radius:9px }
    input[type=file] { background:#f6f9f4 }
    button { min-height:41px; padding:9px 16px; margin:3px; color:white; background:var(--forest); border:1px solid var(--forest); border-radius:9px; font-weight:720; transition:background .15s,transform .15s }
    button:hover { background:var(--pine); transform:translateY(-1px) }
    button:disabled { opacity:.5; cursor:not-allowed; transform:none }
    summary { color:var(--forest); padding:4px 0 }
    details[open] > summary { margin-bottom:19px }
    .warn { color:#946322 }
    .ok { color:#28744f }
    small { color:var(--muted) }
    @media(max-width:1080px) { .summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)) } .summary-card:first-child { grid-column:1/-1 } .header-inner { gap:20px } .main-nav a { padding:0 10px } }
    @media(max-width:760px) { .header-inner,main { width:min(100% - 32px,1440px) } .header-inner { min-height:64px; flex-wrap:wrap; column-gap:12px } .main-nav { order:3; width:100%; min-width:0; overflow-x:auto; flex:auto; white-space:nowrap; min-height:44px } .main-nav a { padding:9px 11px 7px } .logout-form { margin-left:auto } main { padding-top:28px } .home-sections { display:block } .page-heading { display:block } .text-link { display:inline-block; margin-top:10px } .login-layout { grid-template-columns:1fr } .login-intro { min-height:280px; padding:35px } .login-intro h1 { font-size:2.8rem } .login-panel { padding:35px } }
    @media(max-width:520px) { .header-inner,main { width:min(100% - 24px,1440px) } .summary-grid { grid-template-columns:1fr; gap:9px } .summary-card:first-child { grid-column:auto } .summary-card { min-height:135px; padding:19px 20px } section { padding:21px 19px; border-radius:15px } .page-heading h2 { font-size:2.35rem } .metric-large { font-size:2.6rem } .date-picker label,.date-picker input { width:100% } .login-intro { min-height:240px; padding:28px } .login-intro h1 { font-size:2.25rem } .login-panel { padding:28px } }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto } button { transition:none } }
  </style>
</head>
<body>
<header class="app-header"><div class="header-inner">
  <a class="brand" href="/" aria-label="Свои бумаги — на главную"><span class="brand-mark" aria-hidden="true"><span>↗</span></span>Свои бумаги</a>
  {% if logged_in %}
  <nav class="main-nav" aria-label="Основная навигация"><a href="/" {% if active_nav == 'portfolio' %}aria-current="page"{% endif %}>Портфель</a><a href="/analytics" {% if active_nav == 'analytics' %}aria-current="page"{% endif %}>Аналитика</a><a href="/instruments" {% if active_nav == 'instruments' %}aria-current="page"{% endif %}>Бумаги</a><a href="/operations" {% if active_nav == 'operations' %}aria-current="page"{% endif %}>Операции</a></nav>
  <form class="logout-form" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Выйти</button></form>
  {% endif %}
</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
